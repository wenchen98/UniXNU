# Build the pinned OnePlus 5 device profile on this fork.
name: macOS build (cheeseburger)

# Kernel and payload for the OnePlus 5 port.  The firmware volume is built separately by
# edk2-msm8998/build.sh (GCC5) and packaged with the device repository's make-bootimg.py;
# this workflow only covers the steps that need Xcode.
#
# Inputs are the device repository and ref.  Run it after pushing UniXNU-cheeseburger:
#   gh workflow run macos-cheeseburger.yml -f device_repository=<owner>/UniXNU-cheeseburger
#
# Secrets:
#   UNIXNU_DEVICE_TOKEN    checkout token for a private device repository (optional)
#   UNIXNU_UNIQUE_CHIP_ID  platform seed for the payload ADT (optional for the first run)

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: lss717/UniXNU-cheeseburger
      device_ref:
        description: Device repository ref
        required: true
        default: main
      ipsw_url:
        description: IPSW URL (empty uses board.toml [ipsw])
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      build_userdata:
        description: Also build the userdata image (needs the Data seed later)
        type: boolean
        default: false
      preboot_layout:
        description: Mount SystemOS at /private/preboot/Cryptexes/OS with a staged Preboot overlay
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-cheeseburger-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  GITHUB_TOKEN: ${{ github.token }}
  UNIXNU_DEVICE: ${{ github.workspace }}/device

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lss717/UniXNU
          ref: 316efac82842aabf0a62aaaed05c586ab4abc632
      - name: Apply verified board build adaptations
        run: |
          printf '%s' '' | base64 -D > /tmp/board-adaptation.patch
          git apply --check /tmp/board-adaptation.patch
          git apply /tmp/board-adaptation.patch

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --find mig || echo 'mig not found for iphoneos'
          /usr/bin/compression_tool -h >/dev/null 2>&1 && echo 'compression_tool ok' || echo 'compression_tool missing'

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Select the device
        run: |
          config="$UNIXNU_DEVICE/configs/cheeseburger_defconfig"
          grep -Fxq '# CONFIG_XNU_NATIVE_LEGACY_DISPLAY is not set' "$config"
          sed -i '' 's/^# CONFIG_XNU_NATIVE_LEGACY_DISPLAY is not set$/CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y/' "$config"
          sed -i '' '/^# CONFIG_XNU_NATIVE_KEYSTORE is not set$/d; /^CONFIG_XNU_NATIVE_KEYSTORE=/d' "$config"
          printf '\nCONFIG_XNU_NATIVE_KEYSTORE=y\n' >> "$config"
          ./unixnu defconfig cheeseburger_defconfig -D "$UNIXNU_DEVICE"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D "$UNIXNU_DEVICE"

      - name: Prepare inputs
        env:
          TRUST_CACHE_URL: ${{ inputs.trust_cache_url }}
        run: |
          if [ -n "$TRUST_CACHE_URL" ]; then
            curl -fL "$TRUST_CACHE_URL" -o "$RUNNER_TEMP/trustcache"
          fi

      - name: Prepare Data skeleton
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          PREBOOT_LAYOUT: ${{ inputs.preboot_layout }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$PREBOOT_LAYOUT" = "true" ]; then
            source="${IPSW_URL:-$(python3 -c 'import tomllib; print(tomllib.load(open("device/board.toml", "rb"))["ipsw"]["url"])')}"
            python3 scripts/prepare-preboot-overlay.py --ipsw "$source" --output build/preboot-overlay
            extra+=(--preboot-overlay build/preboot-overlay)
          fi
          python3 scripts/prepare-owner-data-fixture.py --skeleton --size-mib 512 --packed \
            --output build/owner-data-fixture ${extra[@]+"${extra[@]}"}
          uuid="$(python3 -c 'import json; print(json.load(open("build/owner-data-fixture/seed.json"))["volume_uuid"])')"
          test -n "$uuid"
          echo "XNU_OWNER_DATA_VOLUME_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Reset cached XNU worktree
        run: rm -rf out/cheeseburger/tree

      - name: Use runner LLVM for device archive tools
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from shutil import which

          objcopy = which("llvm-objcopy")
          if not objcopy:
              raise SystemExit("llvm-objcopy is missing from PATH")
          scripts = Path(os.environ["UNIXNU_DEVICE"]) / "scripts"
          for name in ("build-sheng-pmgr.py", "build-native-ufs-runtime.py"):
              path = scripts / name
              source = path.read_text()
              old = "Path('/opt/local/bin/llvm-objcopy')"
              if old not in source:
                  raise SystemExit(f"{path}: expected MacPorts fallback is missing")
              path.write_text(source.replace(old, f"Path({objcopy!r})"))
          PY

      - name: Prepare Beta6.2 GPU firmware inputs
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/a540"
          mkdir -p "$cache"
          base=https://raw.githubusercontent.com/FabricioSC123/vendor_oneplus_cheeseburger/master/proprietary/vendor/firmware
          for f in a530_pm4.fw a530_pfp.fw a540_gpmu.fw2 a540_zap.mdt a540_zap.b02 a540_zap.elf; do
            curl -fLSs --retry 3 "$base/$f" -o "$cache/$f"
          done
          echo "OP5_A540_FIRMWARE=$cache" >> "$GITHUB_ENV"
          kc="$(./unixnu ipsw fetch KernelCache -D "$UNIXNU_DEVICE" | tail -1)"
          test -s "$kc"
          echo "OP5_KERNELCACHE=$kc" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("scripts/gen-a540-firmware.py")
          s = path.read_text()
          for old, new in (
              ("530c0a89308b275231bbcbaf0eb3104cccbb885e9014993aea5d6d81aa9063be",
               "879d9a530f253efd8168fd32fe4ee4b56f78bb23d681a405249072c589bf127e"),
              ("efac89c56dd23caad79ba247f61c54a2624b4e0f61c391d2c92f3065c22a6f40",
               "cd4620f9de8d77272df15848bcabfc5b1e9e7983d038c6d2e02176019927b82f"),
          ):
              assert s.count(old) == 1
              s = s.replace(old, new)
          path.write_text(s)
          board = Path(os.environ["UNIXNU_DEVICE"]) / "board.toml"
          s = board.read_text()
          key = '  "build-sheng-pmgr.py",'
          assert s.count(key) == 1
          board.write_text(s.replace(key, '  "build-op5-legacy-display.py",' + chr(10) + key))
          PY

      - name: Build kernel
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          # Temporary B5 bring-up: SystemOS at /private/preboot with the owner
          # dyld cache carrier enabled.
          XNU_NATIVE_LEGACY_DISPLAY: 1
          XNU_OWNER_CACHE_MOUNT: 1
          XNU_OWNER_CACHE_STARTUP: 1
          XNU_OWNER_CACHE_CARRIER: 1
          XNU_NATIVE_CS_HASH_CACHE: 1
          XNU_OWNER_UNION_SYSTEMOS: 0
          XNU_OWNER_PREBOOT_LAYOUT: ${{ inputs.preboot_layout && '1' || '0' }}
          XNU_BRINGUP_CACHE_MOUNT: 1
          # H82: writable Data skeleton at /private/var for launchd.
          XNU_OWNER_DATA_MOUNT: 1
          # Temporary volatile Data bring-up; restore the authenticated owner
          # boot manifest together with VerifiedRoot/TrustCache.
          XNU_OWNER_BOOT_MANIFEST: 0
          XNU_OWNER_DATA_VOLATILE: 1
          XNU_NATIVE_RAM_BLOCK: 1
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          board="$UNIXNU_DEVICE/board.toml"
          cp "$board" "$RUNNER_TEMP/cheeseburger-board.toml"
          trap 'cp "$RUNNER_TEMP/cheeseburger-board.toml" "$board"' EXIT
          grep -q '"build-sheng-pmgr.py"' "$board"
          sed -i '' 's/"build-sheng-pmgr.py"/"build-sheng-pmgr-stub.py"/' "$board"
          ./unixnu build kernel "${args[@]}" -D "$UNIXNU_DEVICE"
          test -s out/cheeseburger/kernel/kernel.macho
          cp "$RUNNER_TEMP/cheeseburger-board.toml" "$board"
          ./unixnu build kernel "${args[@]}" -D "$UNIXNU_DEVICE"

      - name: Debug XNU patch source
        if: always()
        run: |
          test -d out/cheeseburger/tree || exit 0
          find out/cheeseburger/tree -path '*xnu-work/bsd/kern/kern_exec.c' -print
          p=$(find out/cheeseburger/tree -path '*xnu-work/bsd/kern/kern_exec.c' -print -quit)
          if [ -n "$p" ]; then
            grep -n -A8 -B6 'native_owner_cache_prepare' "$p" | head -60
            git -C "$(dirname "$p")" status --short 2>/dev/null | head -20 || true
          fi
          for log in out/cheeseburger/logs/kernel.log out/cheeseburger/logs/kernel-bootstrap.log; do
            if [ -f "$log" ]; then
              echo "== $log"
              grep -nE 'error:|#error|Undefined symbols|ld: |redefined' "$log" | tail -40 || true
            fi
          done
          grep -R '^options.*CONFIG_UNION_MOUNTS' out/cheeseburger/tree/.cache/xnu-work/config 2>/dev/null || true

      - name: Build payload
        env:
          UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then args+=(--trust-cache "$RUNNER_TEMP/trustcache"); fi
          if [ -n "$UNIQUE_CHIP_ID" ]; then args+=(--unique-chip-id "$UNIQUE_CHIP_ID"); fi
          data="$GITHUB_WORKSPACE/build/owner-data-fixture/owner-data.dbr"
          test -f "$data"
          args+=(--data-ramdisk "$data")
          ./unixnu build payload "${args[@]}" -D "$UNIXNU_DEVICE"

      - name: Build userdata
        if: inputs.build_userdata
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build userdata "${args[@]}" -D "$UNIXNU_DEVICE"

      - name: Split userdata image for artifact transport
        if: inputs.build_userdata
        run: |
          cd out/cheeseburger/userdata
          test -f userdata-root.img
          shasum -a 256 userdata-root.img > userdata-root.img.sha256
          cat userdata-root.img.sha256
          split -b 1992294400 userdata-root.img userdata-root.img.part.
          ls -lh userdata-root.img.part.*

      - name: Summarise the artifacts
        if: always()
        run: |
          {
            echo '## cheeseburger build'
            echo
            echo '```'
            find out/cheeseburger -maxdepth 3 -type f \( -name '*.json' -o -name '*.img' -o -name '*.macho' -o -name '*.adt' \) -printf '%10s  %p\n' 2>/dev/null | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel and payload
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-cheeseburger
          path: |
            out/cheeseburger/kernel/**
            out/cheeseburger/payload/**
            out/cheeseburger/logs/**
            build/owner-data-fixture/owner-data.dbr
            build/owner-data-fixture/seed.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload userdata parts
        if: inputs.build_userdata
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-cheeseburger-userdata
          path: |
            out/cheeseburger/userdata/userdata-root.json
            out/cheeseburger/userdata/userdata-root.img.sha256
            out/cheeseburger/userdata/userdata-root.img.part.*
          if-no-files-found: error
          retention-days: 7

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf out/ipsw out/feeds device/.cache/firmware out/cheeseburger/tree/.cache/firmware
          rm -f "$RUNNER_TEMP/trustcache"
