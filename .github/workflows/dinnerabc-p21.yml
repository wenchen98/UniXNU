# Rebuild DinnerABC's P21 (2026-10-31) OnePlus 5 kernel: the one whose CPU-rendered desktop and
# touch were verified on hardware (DinnerABC/UniXNU-cheeseburger HANDOFF.md).
#
# Only the steps that need Xcode run here: framework checkout, board runtime, XNU, prelink and
# the panic screen.  The root policies, device tree, payload and boot image are assembled on the
# workstation from these outputs.  This branch of the fork is the official framework at 16e592ab
# (the commit the device repository pins) plus the cheeseburger-p21/ directory.
name: DinnerABC P21 kernel (cheeseburger)

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Commit of DinnerABC/UniXNU-cheeseburger to build
        required: true
        default: a42377d08efcd3c1a5bc71a1161788ed676267a5
      policies_tag:
        description: Release tag of this repository holding policies.zip (empty = stub policies, the kernel then refuses its root at boot)
        required: false
        default: ""
      jobs:
        description: Parallel build jobs
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: dinnerabc-p21-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  GH_TOKEN: ${{ github.token }}
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  UNIXNU_DEVICE: ${{ github.workspace }}/device
  P21_FRAMEWORK: ${{ github.workspace }}
  P21_DEVICE: ${{ github.workspace }}/device
  P21_OUT: ${{ github.workspace }}/out
  P21_BUILD_DIR: ${{ github.workspace }}/cheeseburger-p21
  P21_POLICY_INPUTS: ${{ runner.temp }}/inputs.S
  JOBS: ${{ inputs.jobs }}
  WORK: out/cheeseburger/ipados-17.7.11-21H461/cheeseburger

jobs:
  kernel:
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Initialise the framework submodules the kernel uses
        run: |
          git submodule update --init --depth 1 -- \
            drivers/ArmCpu drivers/ArmDTPlatform drivers/SoftwareAES drivers/GopFramebuffer \
            drivers/RamBlock drivers/AppleKeyStoreState drivers/VirtioMmioBlock drivers/VirtioMmioConsole \
            kits/VerifiedRoot kits/XnuPrelink kits/ArmSmmu4K
          git submodule status

      - uses: actions/checkout@v4
        with:
          repository: DinnerABC/UniXNU-cheeseburger
          ref: ${{ inputs.device_ref }}
          path: device

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --find mig || echo 'mig not found for iphoneos'
          /usr/bin/compression_tool -h >/dev/null 2>&1 && echo 'compression_tool ok' || echo 'compression_tool missing'

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Apply the device repository's framework patches
        run: |
          git apply --check device/patches/framework/*.patch
          git apply device/patches/framework/*.patch
          git status --short

      - name: Point the SoC layer at the device repository
        run: cp cheeseburger-p21/local.toml device/local.toml

      - name: Prepare the verified-root policies
        env:
          POLICIES_TAG: ${{ inputs.policies_tag }}
        run: |
          set -euo pipefail
          if [ -z "$POLICIES_TAG" ]; then
            python3 cheeseburger-p21/write-policy-asm.py --stub "$P21_POLICY_INPUTS"
            exit 0
          fi
          download="$RUNNER_TEMP/policies-download"
          unpacked="$RUNNER_TEMP/policies"
          mkdir -p "$download" "$unpacked"
          gh release download "$POLICIES_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'policies.zip' --pattern 'policies.zip.sha256' --dir "$download"
          (cd "$download" && shasum -a 256 -c policies.zip.sha256)
          unzip -q "$download/policies.zip" -d "$unpacked"
          python3 cheeseburger-p21/write-policy-asm.py "$unpacked" "$P21_POLICY_INPUTS"

      - name: Select the device configuration
        run: |
          ./unixnu defconfig cheeseburger_defconfig -D "$P21_DEVICE" --out "$P21_OUT"
          ./unixnu status -D "$P21_DEVICE" --out "$P21_OUT"

      - name: Fetch the original kernelcache
        run: |
          path="$(./unixnu ipsw fetch KernelCache -D "$P21_DEVICE" --out "$P21_OUT" | tail -1)"
          test -s "$path"
          echo "$path" > "$RUNNER_TEMP/kernelcache.path"
          ls -l "$path"
          shasum -a 256 "$path"

      - name: Build the kernel
        run: python3 cheeseburger-p21/build-kernel.py

      - name: Prelink against the original kernelcache
        run: |
          python3 cheeseburger-p21/prelink.py \
            "$WORK/native/kernel.macho" "$(cat "$RUNNER_TEMP/kernelcache.path")" "$WORK/prelink"
          mkdir -p "$WORK/kernel"
          cp "$WORK/prelink/kernel.macho" "$WORK/kernel/kernel.macho"

      - name: Add the panic screen
        continue-on-error: true
        run: |
          font="$RUNNER_TEMP/uefi-sheng/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib"
          mkdir -p "$font"
          curl -fLsS --retry 3 -o "$font/Font.h" \
            https://raw.githubusercontent.com/UniXNU/uefi-sheng/0eb4514db0744b8136a3897ab1af93b713c2c27b/Silicon/Silicium/SiliciumPkg/Library/FrameBufferSerialPortLib/Font.h
          test -s "$font/Font.h"
          UNIXNU_UEFI="$RUNNER_TEMP/uefi-sheng" \
            python3 scripts/patch-xnu-entry-probe.py "$WORK/kernel/kernel.macho" --panic-screen --no-reset

      - name: Summarise
        if: always()
        run: |
          {
            echo '## DinnerABC P21 kernel'
            echo
            echo '```'
            find "$WORK" -maxdepth 2 -type f \( -name '*.json' -o -name 'kernel.macho' \) -exec ls -l {} \; 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for log in "$WORK"/logs/*.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            grep -nE 'error:|#error|Undefined symbols|ld: |redefined|failed|Error' "$log" | tail -25 || true
          done
          for log in "$WORK"/runtime-build/*-compile.log "$WORK"/runtime-build/*-late.log; do
            [ -f "$log" ] || continue
            if [ -s "$log" ]; then echo "== $log"; tail -30 "$log"; fi
          done

      - name: Upload the kernel and the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dinnerabc-p21-kernel
          path: |
            out/cheeseburger/**/prelink/kernel.macho
            out/cheeseburger/**/kernel/kernel.macho
            out/cheeseburger/**/kernel-source-build.json
            out/cheeseburger/**/logs/**
            out/cheeseburger/**/runtime-build/*.json
            out/cheeseburger/**/runtime-build/*.log
            out/state.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove proprietary inputs
        if: always()
        run: rm -rf out/ipsw out/feeds
